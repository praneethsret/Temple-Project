<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Ticket</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tickets.css">
</head>

<body>

<div class="ticket-container">

<h2>🛕 New Archana Ticket</h2>

<label>📞 Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter Mobile Number">

<button id="searchBtn">🔍 Search Devotee</button>

<label>👤 Family Head</label>
<input type="text" id="headName" placeholder="Family Head Name">

<div id="membersArea">

<h3>Family Members</h3>

</div>

<button id="addMember">
➕ Add Family Member
</button>

<label>🕉️ Gotram</label>
<input type="text" id="gotram" placeholder="Enter Gotram">

<label>⭐ Nakshatram (Optional)</label>
<input type="text" id="nakshatram" placeholder="Optional">

<label>💳 Payment</label>

<select id="payment">

<option>Cash</option>

<option>UPI</option>

</select>

<label>💰 Amount</label>

<input
type="number"
id="amount"
value="500"
readonly>

<label>📝 Notes</label>

<textarea id="notes"></textarea>

<button id="issueTicket">

🎟 ISSUE TICKET

</button>

</div>

<script src="js/tickets.js"></script>

</body>
  </html>
